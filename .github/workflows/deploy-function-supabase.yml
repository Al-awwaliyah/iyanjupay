name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Verify Supabase credentials
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "ERROR: SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

          if [ -z "${SUPABASE_PROJECT_ID:-}" ]; then
            echo "ERROR: SUPABASE_PROJECT_ID is not configured."
            exit 1
          fi

          echo "Supabase project: $SUPABASE_PROJECT_ID"
          echo "Supabase access token is present."

          supabase functions list \
            --project-ref "$SUPABASE_PROJECT_ID"

      - name: Verify Edge Function source tree
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Supabase Edge Function source tree..."

          test -f supabase/functions/_shared/auth.ts
          test -f supabase/functions/_shared/topupmate.ts
          test -f supabase/functions/topupmate-cards/index.ts
          test -f supabase/functions/topupmate-services/index.ts

          echo ""
          echo "Required files found:"
          echo ""

          ls -lh supabase/functions/_shared/auth.ts
          ls -lh supabase/functions/_shared/topupmate.ts
          ls -lh supabase/functions/topupmate-cards/index.ts
          ls -lh supabase/functions/topupmate-services/index.ts

      - name: Remove retired Peyflex Edge Function
        shell: bash
        run: |
          supabase functions delete \
            peyflex-services \
            --project-ref "$SUPABASE_PROJECT_ID" || true

      - name: Deploy Supabase Edge Functions
        shell: bash
        run: |
          set -euo pipefail

          for function_dir in supabase/functions/*; do
            [ -d "$function_dir" ] || continue

            function_name="$(basename "$function_dir")"

            if [ "$function_name" = "_shared" ]; then
              continue
            fi

            if [ "$function_name" = "topupmate-services" ]; then
              continue
            fi

            echo ""
            echo "=========================================="
            echo "Deploying Function: $function_name"
            echo "=========================================="

            supabase functions deploy \
              "$function_name" \
              --use-api \
              --project-ref "$SUPABASE_PROJECT_ID"
          done

      - name: Deploy Topupmate Services
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=========================================="
          echo "Deploying Function: topupmate-services"
          echo "=========================================="

          echo "Verifying Topupmate service files..."

          test -f supabase/functions/topupmate-services/index.ts
          test -f supabase/functions/_shared/auth.ts
          test -f supabase/functions/_shared/topupmate.ts

          echo ""
          echo "Topupmate services source:"
          ls -lh supabase/functions/topupmate-services/index.ts

          echo ""
          echo "Shared auth source:"
          ls -lh supabase/functions/_shared/auth.ts

          echo ""
          echo "Shared Topupmate source:"
          ls -lh supabase/functions/_shared/topupmate.ts

          echo ""
          echo "Deploying topupmate-services..."

          supabase functions deploy \
            topupmate-services \
            --use-api \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --debug
