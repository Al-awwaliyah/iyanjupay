name: Build IyanjuPay Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build

      - name: Generate Android project
        run: bunx cap add android

      - name: Generate native IyanjuPay icon
        run: bunx @capacitor/assets@3.0.5 generate --android --assetPath resources --iconBackgroundColor '#ffffff'

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Decode Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/iyanjupay-release-key.jks

      - name: Create Android signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=iyanjupay-release-key.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Configure Android release signing
        working-directory: android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text()

          signing_block = """
          signingConfigs {
              release {
                  def keystorePropertiesFile = rootProject.file("keystore.properties")
                  def keystoreProperties = new Properties()

                  if (keystorePropertiesFile.exists()) {
                      keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                  }

                  storeFile file(keystoreProperties["storeFile"])
                  storePassword keystoreProperties["storePassword"]
                  keyAlias keystoreProperties["keyAlias"]
                  keyPassword keystoreProperties["keyPassword"]
              }
          }
          """

          if "signingConfigs {" not in text:
              text = text.replace(
                  "android {",
                  "android {" + signing_block,
                  1
              )

          text = text.replace(
              "buildTypes {",
              """buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }""",
              1
          )

          path.write_text(text)
          PY

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verify APK signature
        working-directory: android
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)

          "$APKSIGNER" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Rename release APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/IyanjuPay.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: IyanjuPay-Android-release
          path: android/app/build/outputs/apk/release/IyanjuPay.apk
          if-no-files-found: error
