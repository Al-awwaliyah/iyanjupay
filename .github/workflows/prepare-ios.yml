name: Prepare IyanjuPay iOS Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare-ios:
    runs-on: macos-latest

    env:
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build

      # ------------------------------------------------------------
      # Generate iOS project
      #
      # Capacitor may report a pod install failure here because the
      # biometric plugin requires a higher iOS deployment target.
      # The Xcode project and Podfile are still created successfully,
      # so we continue and correct the target below.
      # ------------------------------------------------------------
      - name: Generate iOS project
        shell: bash
        run: |
          set +e

          bunx cap add ios

          CAP_EXIT=$?

          if [ ! -f "ios/App/Podfile" ]; then
            echo "ERROR: Capacitor did not create ios/App/Podfile."
            exit "$CAP_EXIT"
          fi

          if [ "$CAP_EXIT" -ne 0 ]; then
            echo "Initial CocoaPods installation failed."
            echo "Continuing to correct the iOS deployment target."
          else
            echo "iOS project generated successfully."
          fi

          exit 0

      # ------------------------------------------------------------
      # Configure iOS deployment target
      # ------------------------------------------------------------
      - name: Configure iOS deployment target
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          deployment_target = "15.0"

          podfile = Path("ios/App/Podfile")

          if not podfile.exists():
              raise SystemExit("ERROR: ios/App/Podfile does not exist.")

          text = podfile.read_text()

          if re.search(r"^\s*platform\s*:ios", text, re.MULTILINE):
              text = re.sub(
                  r"^\s*platform\s*:ios.*$",
                  f"platform :ios, '{deployment_target}'",
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
          else:
              text = (
                  f"platform :ios, '{deployment_target}'\n\n"
                  + text
              )

          podfile.write_text(text)

          print(
              f"Podfile deployment target configured: iOS {deployment_target}"
          )
          PY

      # ------------------------------------------------------------
      # Configure Xcode deployment target
      # ------------------------------------------------------------
      - name: Configure Xcode deployment target
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          deployment_target = "15.0"

          project_files = list(
              Path("ios/App").glob("**/*.pbxproj")
          )

          if not project_files:
              raise SystemExit(
                  "ERROR: No Xcode project file was found."
              )

          for project_file in project_files:
              text = project_file.read_text()

              text = re.sub(
                  r"IPHONEOS_DEPLOYMENT_TARGET = [^;]+;",
                  f"IPHONEOS_DEPLOYMENT_TARGET = {deployment_target};",
                  text,
              )

              project_file.write_text(text)

              print(
                  f"Configured {project_file} for iOS "
                  f"{deployment_target}"
              )
          PY

      # ------------------------------------------------------------
      # Verify Podfile configuration before CocoaPods
      # ------------------------------------------------------------
      - name: Verify iOS deployment target
        shell: bash
        run: |
          echo "Podfile:"
          grep -n "platform :ios" ios/App/Podfile || true

          echo
          echo "Xcode deployment targets:"
          grep -R "IPHONEOS_DEPLOYMENT_TARGET" \
            ios/App/*.xcodeproj/project.pbxproj || true

          if ! grep -q "platform :ios, '15.0'" ios/App/Podfile; then
            echo "ERROR: Podfile was not configured for iOS 15.0."
            exit 1
          fi

          echo
          echo "iOS deployment target configuration verified."

      # ------------------------------------------------------------
      # Install native iOS dependencies
      # ------------------------------------------------------------
      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install --repo-update

      # ------------------------------------------------------------
      # Generate native IyanjuPay icons and splash screen
      # ------------------------------------------------------------
      - name: Generate native IyanjuPay icon
        run: |
          bunx @capacitor/assets@3.0.5 generate \
            --ios \
            --assetPath resources \
            --iconBackgroundColor '#ffffff' \
            --iconBackgroundColorDark '#061329' \
            --splashBackgroundColor '#f7f8fc' \
            --splashBackgroundColorDark '#061329'

      # ------------------------------------------------------------
      # Sync Capacitor plugins and native project
      # ------------------------------------------------------------
      - name: Sync Capacitor
        run: bunx cap sync ios

      # ------------------------------------------------------------
      # Configure native push + Face ID capabilities
      # ------------------------------------------------------------
      - name: Configure iOS push and biometric capabilities
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_dir = Path("ios/App/App")
          info = app_dir / "Info.plist"
          if info.exists():
              text = info.read_text()
              key = "<key>NSFaceIDUsageDescription</key>"
              if key not in text:
                  text = text.replace(
                      "</dict>",
                      "    <key>NSFaceIDUsageDescription</key>\n"
                      "    <string>Use Face ID to securely authorize IyanjuPay transactions and unlock the app.</string>\n"
                      "</dict>",
                      1,
                  )
              info.write_text(text)

          project_files = list(Path("ios/App").glob("**/*.pbxproj"))
          for project in project_files:
              text = project.read_text()

              # Tell Xcode to sign the APNs entitlement file.
              if "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;" not in text:
                  text = text.replace(
                      "buildSettings = {",
                      "buildSettings = {\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = App/App.entitlements;",
                      1,
                  )

              project.write_text(text)
          PY

          mkdir -p ios/App/App
          cat > ios/App/App/App.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>aps-environment</key>
              <string>development</string>
          </dict>
          </plist>
          EOF


      # ------------------------------------------------------------
      # Verify native notification plugins
      # ------------------------------------------------------------
      - name: Verify native notification plugins
        shell: bash
        run: |
          if ! find ios/App/Pods -iname "*CapacitorPushNotifications*" -print -quit | grep -q .; then
            echo "ERROR: Capacitor Push Notifications plugin was not installed."
            exit 1
          fi

          if ! find ios/App/Pods -iname "*CapacitorLocalNotifications*" -print -quit | grep -q .; then
            echo "ERROR: Capacitor Local Notifications plugin was not installed."
            exit 1
          fi

          echo "Native notification plugins detected."

      # ------------------------------------------------------------
      # Verify biometric plugin
      # ------------------------------------------------------------
      - name: Verify biometric plugin
        shell: bash
        run: |
          echo "Checking Capgo native biometric plugin..."

          if find ios/App/Pods \
            -iname "*CapgoCapacitorNativeBiometric*" \
            -print -quit | grep -q .; then

            echo "Capgo native biometric plugin detected."

          else

            echo "ERROR: Capgo native biometric plugin was not installed."
            exit 1

          fi

      # ------------------------------------------------------------
      # Verify iOS project
      # ------------------------------------------------------------
      - name: Verify iOS project
        shell: bash
        run: |
          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "ERROR: Xcode project was not created."
            exit 1
          fi

          if [ ! -d "ios/App/Pods" ]; then
            echo "ERROR: CocoaPods dependencies were not installed."
            exit 1
          fi

          if [ ! -f "ios/App/Podfile.lock" ]; then
            echo "ERROR: Podfile.lock was not created."
            exit 1
          fi

          echo "iOS Capacitor project verified successfully."

      # ------------------------------------------------------------
      # Upload prepared iOS project
      # ------------------------------------------------------------
      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: IyanjuPay-iOS-Capacitor-project
          path: ios/
          if-no-files-found: error
