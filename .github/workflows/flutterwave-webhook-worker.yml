
name: Flutterwave webhook queue worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iyanjupay-flutterwave-webhook-worker
  cancel-in-progress: false

jobs:
  process-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate required secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          FLW_WORKER_SECRET: ${{ secrets.FLW_WORKER_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "Missing GitHub secret: SUPABASE_URL"; exit 1; }
          test -n "$FLW_WORKER_SECRET" || { echo "Missing GitHub secret: FLW_WORKER_SECRET"; exit 1; }

      - name: Process queued Flutterwave events
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          FLW_WORKER_SECRET: ${{ secrets.FLW_WORKER_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            "${SUPABASE_URL%/}/functions/v1/flutterwave-webhook-worker" \
            --header "Content-Type: application/json" \
            --header "x-worker-secret: ${FLW_WORKER_SECRET}" \
            --data '{"batch_size":5}'
