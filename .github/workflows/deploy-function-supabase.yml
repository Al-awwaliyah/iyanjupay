name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.115.0

      - name: Verify Supabase credentials
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "ERROR: SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

          if [ -z "${SUPABASE_PROJECT_ID:-}" ]; then
            echo "ERROR: SUPABASE_PROJECT_ID is not configured."
            exit 1
          fi

          echo "Supabase project: $SUPABASE_PROJECT_ID"
          echo "Supabase access token is present."

          supabase functions list \
            --project-ref "$SUPABASE_PROJECT_ID"

      - name: Remove retired Peyflex Edge Function
        run: |
          supabase functions delete \
            peyflex-services \
            --project-ref "$SUPABASE_PROJECT_ID" || true

      - name: Deploy Supabase Edge Functions
        run: |
          set -euo pipefail

          supabase functions deploy \
            --use-api \
            --project-ref "$SUPABASE_PROJECT_ID"
