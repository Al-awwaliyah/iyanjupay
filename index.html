<!DOCTYPE html>

    <!-- =========================================================

    <meta

      content="5CV4Cd697KixhHIYJYZztlKi6TkJpgqqMrWK65qCeMk"
    />

    <!-- =========================================================

    />

    <!-- =========================================================
         FAVICON / APP ICONS
         ========================================================= -->

      rel="icon"
      href="/favicon.ico"
      sizes="any"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icon-192.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"

    <!-- =========================================================

    <meta

    />

    <meta
      property="og:description"
      content="IyanjuPay is a Nigerian digital payment platform for airtime, data, bill payments, wallet funding and money transfers."
    />

      content="https://iyanjupay.vercel.app/"
    />

    />

      content="en_NG"
    />

      property="og:image"
      content="https://iyanjupay.vercel.app/icon-192.png"

    <meta

    <!-- =========================================================

      content="IyanjuPay is a Nigerian digital payment platform for airtime, data, bill payments, wallet funding and money transfers."
    />

      name="twitter:image:alt"
      content="IyanjuPay"
    />

    <!-- =========================================================
         STRUCTURED DATA — GOOGLE SEARCH / KNOWLEDGE SIGNALS
         ========================================================= -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://iyanjupay.vercel.app/#website",
          "url": "https://iyanjupay.vercel.app/",
          "name": "IyanjuPay",
          "alternateName": "Iyanju Pay",
          "description": "IyanjuPay is a Nigerian digital payment platform for airtime, data, bill payments, wallet funding and money transfers.",
          "inLanguage": "en-NG",
          "publisher": {
            "@id": "https://iyanjupay.vercel.app/#organization"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://iyanjupay.vercel.app/#organization",
          "name": "IyanjuPay",
          "alternateName": "Iyanju Pay",
          "url": "https://iyanjupay.vercel.app/",
          "logo": {
            "@type": "ImageObject",
            "@id": "https://iyanjupay.vercel.app/#logo",
            "url": "https://iyanjupay.vercel.app/icon-192.png",
            "contentUrl": "https://iyanjupay.vercel.app/icon-192.png",
            "width": 192,
            "height": 192,
            "caption": "IyanjuPay"
          }
        },
        {
          "@type": "WebApplication",
          "@id": "https://iyanjupay.vercel.app/#application",
          "name": "IyanjuPay",
          "alternateName": "Iyanju Pay",
          "url": "https://iyanjupay.vercel.app/",
          "description": "IyanjuPay is a Nigerian digital payment web application for airtime, data, bill payments, wallet funding and money transfers.",
          "applicationCategory": "FinanceApplication",
          "operatingSystem": "Web",
          "inLanguage": "en-NG",
          "image": "https://iyanjupay.vercel.app/icon-192.png",
          "publisher": {
            "@id": "https://iyanjupay.vercel.app/#organization"
          }
        }
      ]
    }
    </script>
  </head>

  <body>
    <!--
      Zero-JS startup surface. This is intentionally the same visual language
      as AppSplash so slow JS/WebView startup never exposes a bare logo or
      white screen before the real splash renders. The React splash replaces
      this node immediately after mount.
    -->
    <div id="iyanjupay-boot-splash" aria-hidden="true" data-theme="light">
      <div class="iyanjupay-boot-glow iyanjupay-boot-glow-one"></div>
      <div class="iyanjupay-boot-glow iyanjupay-boot-glow-two"></div>
      <div class="iyanjupay-boot-content">
        <img src="/icon-512.png" alt="" draggable="false" />
        <div class="iyanjupay-boot-name">IyanjuPay</div>
        <div class="iyanjupay-boot-tagline">Simple. Secure. Seamless.</div>
        <div class="iyanjupay-boot-line"><span></span></div>
      </div>
    </div>

    <style>
      html, body { margin: 0; min-height: 100%; background: #f7f8fc; }
      #iyanjupay-boot-splash {
        position: fixed; inset: 0; z-index: 2147483647;
        display: grid; place-items: center; overflow: hidden;
        background:
          radial-gradient(circle at 50% 42%, rgba(16,185,129,.08), transparent 30%),
          linear-gradient(180deg, #ffffff 0%, #f7f8fc 100%);
        color: #082a63; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .iyanjupay-boot-glow { position: absolute; border-radius: 999px; filter: blur(70px); pointer-events: none; }
      .iyanjupay-boot-glow-one { width: 260px; height: 260px; background: rgba(16,185,129,.07); animation: ipBootPulse 4s ease-in-out infinite; }
      .iyanjupay-boot-glow-two { width: 120px; height: 120px; background: rgba(37,99,235,.06); transform: translate(90px,-80px); animation: ipBootPulse 3.2s ease-in-out infinite reverse; }
      .iyanjupay-boot-content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; text-align: center; }
      .iyanjupay-boot-content img { width: 104px; height: 104px; border-radius: 28px; object-fit: contain; filter: drop-shadow(0 18px 35px rgba(8,42,99,.16)); animation: ipBootLogo 700ms cubic-bezier(.16,1,.3,1) both; }
      .iyanjupay-boot-name { margin-top: 28px; font-size: 42px; line-height: 1; font-weight: 850; letter-spacing: -.055em; animation: ipBootUp 650ms 100ms cubic-bezier(.16,1,.3,1) both; }
      .iyanjupay-boot-tagline { margin-top: 14px; font-size: 10px; font-weight: 650; letter-spacing: .22em; text-transform: uppercase; color: #64748b; animation: ipBootUp 650ms 180ms cubic-bezier(.16,1,.3,1) both; }
      .iyanjupay-boot-line { width: 34px; height: 2px; margin-top: 24px; overflow: hidden; border-radius: 999px; background: rgba(16,185,129,.18); }
      .iyanjupay-boot-line span { display: block; width: 100%; height: 100%; border-radius: inherit; background: #10b981; transform-origin: left; animation: ipBootLine 1300ms ease-in-out infinite; }
      @keyframes ipBootLogo { from { opacity: 0; transform: translateY(10px) scale(.88); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes ipBootUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes ipBootPulse { 0%,100% { opacity: .45; transform: scale(.92); } 50% { opacity: .9; transform: scale(1.08); } }
      @keyframes ipBootLine { 0% { transform: scaleX(.08); opacity: .35; } 45% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(.08); opacity: .35; } }
      #iyanjupay-boot-splash[data-theme="dark"] {
        background:
          radial-gradient(circle at 50% 42%, rgba(16,185,129,.10), transparent 30%),
          linear-gradient(180deg, #061329 0%, #090d18 100%);
        color: #ffffff;
      }
      #iyanjupay-boot-splash[data-theme="dark"] .iyanjupay-boot-tagline { color: #94a3b8; }
      #iyanjupay-boot-splash[data-theme="dark"] .iyanjupay-boot-line { background: rgba(52,211,153,.18); }
      @media (prefers-reduced-motion: reduce) { .iyanjupay-boot-content *, .iyanjupay-boot-glow { animation: none !important; } }
    </style>

    <script>
      (function () {
        try {
          var saved = localStorage.getItem("iyanjupay-dashboard-theme");
          if (saved === "dark") {
            var splash = document.getElementById("iyanjupay-boot-splash");
            if (splash) splash.setAttribute("data-theme", "dark");
          }
        } catch (_) {}
      })();
    </script>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
