name: Build IyanjuPay Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install

      # ------------------------------------------------------------
      # Verify Capacitor native dependencies
      # ------------------------------------------------------------
      - name: Verify biometric and push dependencies
        shell: bash
        run: |
          echo "Checking Capacitor native dependencies..."

          if ! bun pm ls @capacitor/push-notifications >/dev/null 2>&1; then
            echo "ERROR: @capacitor/push-notifications is not installed."
            exit 1
          fi

          if ! bun pm ls @capacitor-community/biometric >/dev/null 2>&1; then
            echo "ERROR: @capacitor-community/biometric is not installed."
            exit 1
          fi

          echo "Capacitor push notifications:"
          bun pm ls @capacitor/push-notifications

          echo "Capacitor biometric:"
          bun pm ls @capacitor-community/biometric

      # ------------------------------------------------------------
      # Build web application
      # ------------------------------------------------------------
      - name: Build web app
        run: bun run build

      # ------------------------------------------------------------
      # Generate Android project
      # ------------------------------------------------------------
      - name: Generate Android project
        run: bunx cap add android

      # ------------------------------------------------------------
      # Configure Firebase
      # ------------------------------------------------------------
      - name: Configure Firebase for Android
        shell: bash
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

          if [ ! -s android/app/google-services.json ]; then
            echo "ERROR: google-services.json was not created."
            exit 1
          fi

      # ------------------------------------------------------------
      # Configure Firebase Gradle integration
      # ------------------------------------------------------------
      - name: Configure Firebase Gradle integration
        shell: bash
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root_gradle = Path("build.gradle")
          app_gradle = Path("app/build.gradle")

          root_text = root_gradle.read_text()
          app_text = app_gradle.read_text()

          plugin_dependency = "classpath 'com.google.gms:google-services:4.5.0'"

          if "com.google.gms:google-services" not in root_text:
              if "dependencies {" in root_text:
                  root_text = root_text.replace(
                      "dependencies {",
                      "dependencies {\n        " + plugin_dependency,
                      1
                  )
              else:
                  root_text += """

          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }

              dependencies {
                  classpath 'com.google.gms:google-services:4.5.0'
              }
          }
          """

          root_gradle.write_text(root_text)

          if "com.google.gms.google-services" not in app_text:
              app_text += """

          // Firebase Google Services
          apply plugin: 'com.google.gms.google-services'
          """

          firebase_bom = "implementation platform('com.google.firebase:firebase-bom:34.19.0')"
          firebase_messaging = "implementation 'com.google.firebase:firebase-messaging'"

          if "firebase-bom" not in app_text:
              if "dependencies {" in app_text:
                  app_text = app_text.replace(
                      "dependencies {",
                      "dependencies {\n    " + firebase_bom,
                      1
                  )

          if "firebase-messaging" not in app_text:
              if "dependencies {" in app_text:
                  app_text = app_text.replace(
                      "dependencies {",
                      "dependencies {\n    " + firebase_messaging,
                      1
                  )

          app_gradle.write_text(app_text)
          PY

      # ------------------------------------------------------------
      # Generate native app icons / splash screen
      # ------------------------------------------------------------
      - name: Generate native IyanjuPay icon
        run: |
          bunx @capacitor/assets@3.0.5 generate \
            --android \
            --assetPath resources \
            --iconBackgroundColor '#ffffff' \
            --iconBackgroundColorDark '#061329' \
            --splashBackgroundColor '#f7f8fc' \
            --splashBackgroundColorDark '#061329'

      # ------------------------------------------------------------
      # Sync Capacitor plugins into Android
      # ------------------------------------------------------------
      - name: Sync Capacitor
        run: bunx cap sync android

      # ------------------------------------------------------------
      # Verify Firebase configuration
      # ------------------------------------------------------------
      - name: Verify Firebase configuration
        shell: bash
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "ERROR: android/app/google-services.json is missing."
            exit 1
          fi

          if ! grep -q '"package_name"[[:space:]]*:[[:space:]]*"com.iyanjupay.app"' android/app/google-services.json; then
            echo "ERROR: google-services.json does not contain package_name com.iyanjupay.app"
            exit 1
          fi

          echo "Firebase Android configuration verified for com.iyanjupay.app"

      # ------------------------------------------------------------
      # Verify native push integration
      # ------------------------------------------------------------
      - name: Verify Firebase Messaging integration
        shell: bash
        run: |
          if ! grep -q "com.google.firebase:firebase-messaging" android/app/build.gradle; then
            echo "ERROR: Firebase Messaging dependency is missing."
            exit 1
          fi

          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo "ERROR: Google Services Gradle plugin is missing."
            exit 1
          fi

          echo "Firebase Messaging integration verified."

      # ------------------------------------------------------------
      # Verify Capacitor native plugins
      # ------------------------------------------------------------
      - name: Verify Capacitor native plugins
        shell: bash
        run: |
          if [ ! -d android/capacitor-cordova-android-plugins ]; then
            echo "ERROR: Capacitor native plugin integration directory is missing."
            exit 1
          fi

          if ! grep -Rqi "push" android/capacitor-cordova-android-plugins 2>/dev/null; then
            echo "WARNING: Push plugin files were not detected in the generated plugin directory."
          fi

          echo "Capacitor native plugin integration checked."

      # ------------------------------------------------------------
      # Decode Android signing keystore
      # ------------------------------------------------------------
      - name: Decode Android signing keystore
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/iyanjupay-release-key.jks

          if [ ! -s android/app/iyanjupay-release-key.jks ]; then
            echo "ERROR: Android signing keystore was not created."
            exit 1
          fi

      # ------------------------------------------------------------
      # Create signing properties
      # ------------------------------------------------------------
      - name: Create Android signing properties
        shell: bash
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=iyanjupay-release-key.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # ------------------------------------------------------------
      # Configure release signing
      # ------------------------------------------------------------
      - name: Configure release signing
        shell: bash
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle_file = Path("app/build.gradle")
          text = gradle_file.read_text()

          if "keystore.properties" not in text:
              signing_properties = """
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          """

              text = signing_properties + text

              text = text.replace(
                  "android {",
                  """android {
              signingConfigs {
                  release {
                      storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                      storePassword keystoreProperties["storePassword"]
                      keyAlias keystoreProperties["keyAlias"]
                      keyPassword keystoreProperties["keyPassword"]
                  }
              }
          """,
                  1
              )

          if "signingConfig signingConfigs.release" not in text:
              release_index = text.find("buildTypes {")

              if release_index != -1:
                  release_open = text.find("release {", release_index)

                  if release_open != -1:
                      insert_position = release_open + len("release {")

                      text = (
                          text[:insert_position]
                          + "\n            signingConfig signingConfigs.release"
                          + text[insert_position:]
                      )

          gradle_file.write_text(text)
          PY

      # ------------------------------------------------------------
      # Build signed release APK
      # ------------------------------------------------------------
      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease

      # ------------------------------------------------------------
      # Verify APK signature
      # ------------------------------------------------------------
      - name: Verify APK signature
        working-directory: android
        run: |
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      # ------------------------------------------------------------
      # Rename APK
      # ------------------------------------------------------------
      - name: Rename release APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/IyanjuPay.apk

      # ------------------------------------------------------------
      # Upload APK
      # ------------------------------------------------------------
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: IyanjuPay-Android-release
          path: android/app/build/outputs/apk/release/IyanjuPay.apk
          if-no-files-found: error
