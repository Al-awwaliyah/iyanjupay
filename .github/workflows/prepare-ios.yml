name: Build IyanjuPay iOS Simulator App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios-simulator:
    runs-on: macos-latest

    env:
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Node.js
      # ------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ------------------------------------------------------------
      # Bun
      # ------------------------------------------------------------
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      # ------------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: bun install

      # ------------------------------------------------------------
      # Build web application
      # ------------------------------------------------------------
      - name: Build web app
        run: bun run build

      # ------------------------------------------------------------
      # Generate iOS project
      # ------------------------------------------------------------
      - name: Generate iOS project
        shell: bash
        run: |
          set +e

          bunx cap add ios

          CAP_EXIT=$?

          if [ ! -f "ios/App/Podfile" ]; then
            echo "ERROR: Capacitor did not create ios/App/Podfile."
            exit "$CAP_EXIT"
          fi

          if [ "$CAP_EXIT" -ne 0 ]; then
            echo "Initial CocoaPods installation failed."
            echo "Continuing with iOS project configuration."
          else
            echo "iOS project generated successfully."
          fi

          exit 0

      # ------------------------------------------------------------
      # Configure iOS deployment target
      # ------------------------------------------------------------
      - name: Configure iOS deployment target
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          deployment_target = "15.0"

          podfile = Path("ios/App/Podfile")

          if not podfile.exists():
              raise SystemExit(
                  "ERROR: ios/App/Podfile does not exist."
              )

          text = podfile.read_text()

          platform_line = re.compile(
              r"^\s*platform\s*:ios.*$",
              re.MULTILINE,
          )

          if platform_line.search(text):
              text = platform_line.sub(
                  f"platform :ios, '{deployment_target}'",
                  text,
                  count=1,
              )
          else:
              text = (
                  f"platform :ios, '{deployment_target}'\n\n"
                  + text
              )

          podfile.write_text(text)

          print(
              f"Podfile deployment target configured: "
              f"iOS {deployment_target}"
          )
          PY

      # ------------------------------------------------------------
      # Configure Xcode deployment target
      # ------------------------------------------------------------
      - name: Configure Xcode deployment target
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          deployment_target = "15.0"

          project_files = list(
              Path("ios/App").glob("**/*.pbxproj")
          )

          if not project_files:
              raise SystemExit(
                  "ERROR: No Xcode project file was found."
              )

          for project_file in project_files:
              text = project_file.read_text()

              text = re.sub(
                  r"IPHONEOS_DEPLOYMENT_TARGET = [^;]+;",
                  f"IPHONEOS_DEPLOYMENT_TARGET = {deployment_target};",
                  text,
              )

              project_file.write_text(text)

              print(
                  f"Configured {project_file} for iOS "
                  f"{deployment_target}"
              )
          PY

      # ------------------------------------------------------------
      # Verify deployment target
      # ------------------------------------------------------------
      - name: Verify iOS deployment target
        shell: bash
        run: |
          set -e

          echo "Podfile:"
          grep -n "platform :ios" ios/App/Podfile || true

          echo ""
          echo "Xcode deployment targets:"
          grep -R "IPHONEOS_DEPLOYMENT_TARGET" \
            ios/App/*.xcodeproj/project.pbxproj || true

          if ! grep -q "platform :ios, '15.0'" ios/App/Podfile; then
            echo "ERROR: Podfile was not configured for iOS 15.0."
            exit 1
          fi

          echo ""
          echo "iOS deployment target verified."

      # ------------------------------------------------------------
      # Install CocoaPods
      # ------------------------------------------------------------
      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: |
          pod install --repo-update

      # ------------------------------------------------------------
      # Generate native IyanjuPay icon / splash
      # ------------------------------------------------------------
      - name: Generate native IyanjuPay icon
        run: |
          bunx @capacitor/assets@3.0.5 generate \
            --ios \
            --assetPath resources \
            --iconBackgroundColor '#ffffff' \
            --iconBackgroundColorDark '#061329' \
            --splashBackgroundColor '#f7f8fc' \
            --splashBackgroundColorDark '#061329'

      # ------------------------------------------------------------
      # Sync Capacitor
      # ------------------------------------------------------------
      - name: Sync Capacitor
        run: |
          bunx cap sync ios

      # ------------------------------------------------------------
      # Configure Face ID usage description
      # ------------------------------------------------------------
      - name: Configure Face ID
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          info = Path("ios/App/App/Info.plist")

          if not info.exists():
              raise SystemExit(
                  "ERROR: ios/App/App/Info.plist does not exist."
              )

          text = info.read_text()

          key = "<key>NSFaceIDUsageDescription</key>"

          if key not in text:
              text = text.replace(
                  "</dict>",
                  """    <key>NSFaceIDUsageDescription</key>
              <string>Use Face ID to securely authorize IyanjuPay transactions and unlock the app.</string>
          </dict>""",
                  1,
              )

          info.write_text(text)

          print("Face ID usage description configured.")
          PY

      # ------------------------------------------------------------
      # Configure APNs entitlements
      # ------------------------------------------------------------
      - name: Configure iOS push notification entitlement
        shell: bash
        run: |
          set -e

          mkdir -p ios/App/App

          cat > ios/App/App/App.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>aps-environment</key>
              <string>development</string>
          </dict>
          </plist>
          EOF

          python3 - <<'PY'
          from pathlib import Path

          project_files = list(
              Path("ios/App").glob("**/*.pbxproj")
          )

          if not project_files:
              raise SystemExit(
                  "ERROR: No Xcode project file found."
              )

          for project in project_files:
              text = project.read_text()

              if "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;" not in text:
                  text = text.replace(
                      "buildSettings = {",
                      "buildSettings = {\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = App/App.entitlements;",
                      1,
                  )

                  project.write_text(text)

          print("APNs entitlement configured.")
          PY

      # ------------------------------------------------------------
      # Verify native notification plugins
      # ------------------------------------------------------------
      - name: Verify native notification plugins
        shell: bash
        run: |
          set -e

          if ! find ios/App/Pods \
            -iname "*CapacitorPushNotifications*" \
            -print -quit \
            | grep -q .; then

            echo "ERROR: Capacitor Push Notifications plugin was not installed."
            exit 1
          fi

          if ! find ios/App/Pods \
            -iname "*CapacitorLocalNotifications*" \
            -print -quit \
            | grep -q .; then

            echo "ERROR: Capacitor Local Notifications plugin was not installed."
            exit 1
          fi

          echo "Native notification plugins detected."

      # ------------------------------------------------------------
      # Verify biometric plugin
      # ------------------------------------------------------------
      - name: Verify biometric plugin
        shell: bash
        run: |
          set -e

          if find ios/App/Pods \
            -iname "*CapgoCapacitorNativeBiometric*" \
            -print -quit \
            | grep -q .; then

            echo "Capgo native biometric plugin detected."

          else
            echo "ERROR: Capgo native biometric plugin was not installed."
            exit 1
          fi

      # ------------------------------------------------------------
      # Verify iOS project
      # ------------------------------------------------------------
      - name: Verify iOS project
        shell: bash
        run: |
          set -e

          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "ERROR: Xcode project was not created."
            exit 1
          fi

          if [ ! -d "ios/App/App.xcworkspace" ]; then
            echo "ERROR: Xcode workspace was not created."
            exit 1
          fi

          if [ ! -d "ios/App/Pods" ]; then
            echo "ERROR: CocoaPods dependencies were not installed."
            exit 1
          fi

          if [ ! -f "ios/App/Podfile.lock" ]; then
            echo "ERROR: Podfile.lock was not created."
            exit 1
          fi

          echo "iOS Capacitor project verified successfully."

      # ------------------------------------------------------------
      # Show available Xcode version
      # ------------------------------------------------------------
      - name: Verify Xcode environment
        run: |
          xcodebuild -version
          xcode-select -p

      # ------------------------------------------------------------
      # Build iOS Simulator .app
      #
      # This is the critical step missing from the previous workflow.
      # Appetize needs the resulting Simulator .app bundle.
      # ------------------------------------------------------------
      - name: Build iOS Simulator app
        working-directory: ios/App
        shell: bash
        run: |
          set -e

          rm -rf ../../ios-simulator-build

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ../../ios-simulator-build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      # ------------------------------------------------------------
      # Locate generated .app
      # ------------------------------------------------------------
      - name: Locate iOS Simulator app
        shell: bash
        run: |
          set -e

          APP_PATH="$(
            find ios-simulator-build/Build/Products \
              -maxdepth 2 \
              -type d \
              -name "App.app" \
              -print \
              -quit
          )"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No App.app was produced."
            echo ""
            echo "Available build products:"
            find ios-simulator-build/Build/Products \
              -maxdepth 3 \
              -print || true
            exit 1
          fi

          echo "Simulator app found:"
          echo "$APP_PATH"

          mkdir -p output

          rm -rf output/IyanjuPay.app

          cp -R \
            "$APP_PATH" \
            output/IyanjuPay.app

          echo ""
          echo "IyanjuPay.app prepared:"
          ls -ld output/IyanjuPay.app

      # ------------------------------------------------------------
      # Verify .app bundle
      # ------------------------------------------------------------
      - name: Verify iOS Simulator app bundle
        shell: bash
        run: |
          set -e

          APP="output/IyanjuPay.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: IyanjuPay.app directory does not exist."
            exit 1
          fi

          if [ ! -f "$APP/Info.plist" ]; then
            echo "ERROR: IyanjuPay.app/Info.plist is missing."
            exit 1
          fi

          if [ ! -f "$APP/App" ]; then
            echo "ERROR: IyanjuPay.app executable is missing."
            exit 1
          fi

          echo "Valid iOS Simulator .app bundle found."

          echo ""
          echo "Bundle contents:"
          ls -lah "$APP" | head -50

      # ------------------------------------------------------------
      # Create Appetize ZIP
      # ------------------------------------------------------------
      - name: Package iOS Simulator app for Appetize
        shell: bash
        run: |
          set -e

          cd output

          zip -r \
            IyanjuPay-iOS-Simulator.zip \
            IyanjuPay.app

          cd ..

          echo "Appetize package created:"
          ls -lh output/IyanjuPay-iOS-Simulator.zip

      # ------------------------------------------------------------
      # Upload raw .app
      # ------------------------------------------------------------
      - name: Upload iOS Simulator .app
        uses: actions/upload-artifact@v4
        with:
          name: IyanjuPay-iOS-Simulator-app
          path: output/IyanjuPay.app
          if-no-files-found: error

      # ------------------------------------------------------------
      # Upload ZIP for Appetize
      # ------------------------------------------------------------
      - name: Upload Appetize iOS package
        uses: actions/upload-artifact@v4
        with:
          name: IyanjuPay-iOS-Appetize
          path: output/IyanjuPay-iOS-Simulator.zip
          if-no-files-found: error
