name: Prepare IyanjuPay iOS Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare-ios:
    runs-on: macos-latest
    env:
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build

      - name: Generate iOS project
        run: bunx cap add ios

      - name: Generate native IyanjuPay icon
        run: bunx @capacitor/assets@3.0.5 generate --ios --assetPath resources --iconBackgroundColor '#ffffff'

      - name: Sync Capacitor
        run: bunx cap sync ios

      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: IyanjuPay-iOS-Capacitor-project
          path: ios/
          if-no-files-found: error
