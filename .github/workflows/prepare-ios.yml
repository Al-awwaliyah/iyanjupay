name: Prepare IyanjuPay iOS Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare-ios:
    runs-on: macos-latest

    env:
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build

      # ------------------------------------------------------------
      # Generate iOS project
      #
      # We decouple the initial validation checklist and ignore the 
      # default pod install step so we can inject higher deployment 
      # targets safely beforehand.
      # ------------------------------------------------------------
      - name: Generate iOS project
        shell: bash
        run: |
          set +e
          bunx cap add ios
          CAP_EXIT=$?

          if [ ! -f "ios/App/Podfile" ]; then
            echo "ERROR: Capacitor did not create ios/App/Podfile."
            exit "$CAP_EXIT"
          fi
          exit 0

      # ------------------------------------------------------------
      # Configure iOS deployment target inside Podfile
      # ------------------------------------------------------------
      - name: Configure iOS deployment target
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          deployment_target = "15.0"
          podfile = Path("ios/App/Podfile")

          if not podfile.exists():
              raise SystemExit("ERROR: ios/App/Podfile does not exist.")

          text = podfile.read_text()

          if re.search(r"^\s*platform\s*:ios", text, re.MULTILINE):
              text = re.sub(
                  r"^\s*platform\s*:ios.*$",
                  f"platform :ios, '{deployment_target}'",
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
          else:
              text = f"platform :ios, '{deployment_target}'\n\n" + text

          podfile.write_text(text)
          print(f"Podfile deployment target configured: iOS {deployment_target}")
          PY

      # ------------------------------------------------------------
      # Configure Xcode deployment target (.pbxproj)
      # ------------------------------------------------------------
      - name: Configure Xcode deployment target
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          deployment_target = "15.0"
          project_files = list(Path("ios/App").glob("**/*.pbxproj"))

          if not project_files:
              raise SystemExit("ERROR: No Xcode project file was found.")

          for project_file in project_files:
              text = project_file.read_text()
              text = re.sub(
                  r"IPHONEOS_DEPLOYMENT_TARGET = [^;]+;",
                  f"IPHONEOS_DEPLOYMENT_TARGET = {deployment_target};",
                  text,
              )
              project_file.write_text(text)
              print(f"Configured {project_file} for iOS {deployment_target}")
          PY

      # ------------------------------------------------------------
      # Install native CocoaPods dependencies with upgraded target
      # ------------------------------------------------------------
      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install --repo-update

      # ------------------------------------------------------------
      # Generate native IyanjuPay icons and splash screen
      # ------------------------------------------------------------
      - name: Generate native IyanjuPay icon
        run: |
          bunx @capacitor/assets@3.0.5 generate \
            --ios \
            --assetPath resources \
            --iconBackgroundColor '#ffffff' \
            --iconBackgroundColorDark '#061329' \
            --splashBackgroundColor '#f7f8fc' \
            --splashBackgroundColorDark '#061329'

      # ------------------------------------------------------------
      # Sync Capacitor native layer plugins
      # ------------------------------------------------------------
      - name: Sync Capacitor
        run: bunx cap sync ios

      # ------------------------------------------------------------
      # Inject Info.plist properties for Face ID & Push Notification Hooks
      # ------------------------------------------------------------
      - name: Configure iOS push and biometric capabilities
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_dir = Path("ios/App/App")
          info = app_dir / "Info.plist"
          if info.exists():
              text = info.read_text()
              key = "<key>NSFaceIDUsageDescription</key>"
              if key not in text:
                  text = text.replace(
                      "</dict>",
                      "    <key>NSFaceIDUsageDescription</key>\n"
                      "    <string>Use Face ID to securely authorize IyanjuPay transactions and unlock the app.</string>\n"
                      "</dict>",
                      1,
                  )
              info.write_text(text)

          project_files = list(Path("ios/App").glob("**/*.pbxproj"))
          for project in project_files:
              text = project.read_text()
              if "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;" not in text:
                  text = text.replace(
                      "buildSettings = {",
                      "buildSettings = {\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = App/App.entitlements;",
                      1,
                  )
              project.write_text(text)
          PY

          mkdir -p ios/App/App
          cat > ios/App/App/App.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>aps-environment</key>
              <string>development</string>
          </dict>
          </plist>
          EOF

      # ------------------------------------------------------------
      # Compile Xcode Project for iOS Simulator Engine
      # ------------------------------------------------------------
      - name: Compile Xcode Simulator App Bundle
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -sdk iphonesimulator \
                     -configuration Debug \
                     -derivedDataPath build_output \
                     clean build

      # ------------------------------------------------------------
      # Dynamically search, isolate, and package Simulator payload
      # ------------------------------------------------------------
      - name: Find and Zip Simulator Build
        run: |
          echo "Searching for target App.app payload..."
          APP_PATH=$(find ios/App/build_output -name "App.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo " ERROR: App.app directory was not resolved in build_output!"
            exit 1
          fi

          echo " Isolated App.app execution block at: $APP_PATH"
          cp -R "$APP_PATH" ./App.app
          zip -r iyanjupay-simulator.zip App.app

      # ------------------------------------------------------------
      # Export to GitHub Artifact Engine
      # ------------------------------------------------------------
      - name: Upload iOS Simulator Package for Appetize
        uses: actions/upload-artifact@v4
        with:
          name: IyanjuPay-Appetize-Simulator-Build
          path: iyanjupay-simulator.zip
          if-no-files-found: error
          retention-days: 5
